<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic To-Do List</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #f87171;
      --danger-hover: #ef4444;
      --success: #4ade80;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    header {
      padding: 28px 28px 20px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 span {
      font-size: 1.5rem;
    }

    .stats {
      margin-top: 8px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .input-row {
      display: flex;
      gap: 10px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
    }

    #taskInput {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #taskInput:focus {
      border-color: var(--accent);
    }

    #taskInput::placeholder {
      color: var(--text-muted);
    }

    #addBtn {
      padding: 12px 20px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #addBtn:hover {
      background: var(--accent-hover);
    }

    #addBtn:active {
      transform: scale(0.97);
    }

    .filters {
      display: flex;
      gap: 8px;
      padding: 16px 28px 0;
    }

    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .filter-btn:hover:not(.active) {
      background: var(--surface-hover);
      color: var(--text);
    }

    #taskList {
      list-style: none;
      padding: 16px 20px 24px;
      max-height: 420px;
      overflow-y: auto;
    }

    #taskList::-webkit-scrollbar {
      width: 6px;
    }

    #taskList::-webkit-scrollbar-track {
      background: transparent;
    }

    #taskList::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg);
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s, opacity 0.25s, transform 0.25s;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item:hover {
      border-color: var(--border);
      background: #1a2436;
    }

    .task-item.completed {
      opacity: 0.65;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      background: transparent;
    }

    .checkbox:hover {
      border-color: var(--accent);
    }

    .task-item.completed .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .checkbox svg {
      width: 14px;
      height: 14px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .task-item.completed .checkbox svg {
      opacity: 1;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      word-break: break-word;
      line-height: 1.4;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(248, 113, 113, 0.12);
    }

    .delete-btn svg {
      width: 18px;
      height: 18px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 56px;
      height: 56px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 0.95rem;
    }

    footer {
      padding: 14px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    #clearCompleted {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      transition: color 0.2s;
    }

    #clearCompleted:hover {
      color: var(--danger);
    }

    #clearCompleted:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1><span>✅</span> To-Do List</h1>
      <p class="stats" id="stats">0 tasks remaining</p>
    </header>

    <div class="input-row">
      <input
        type="text"
        id="taskInput"
        placeholder="What needs to be done?"
        autocomplete="off"
        maxlength="200"
      />
      <button id="addBtn">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <footer>
      <span id="countLabel">0 items</span>
      <button id="clearCompleted" disabled>Clear completed</button>
    </footer>
  </div>

  <script>
    // ---- State ----
    let tasks = JSON.parse(localStorage.getItem("todo-tasks") || "[]");
    let currentFilter = "all";

    // ---- DOM refs ----
    const taskInput = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");
    const statsEl = document.getElementById("stats");
    const countLabel = document.getElementById("countLabel");
    const clearCompletedBtn = document.getElementById("clearCompleted");
    const filterBtns = document.querySelectorAll(".filter-btn");

    // ---- Helpers ----
    function save() {
      localStorage.setItem("todo-tasks", JSON.stringify(tasks));
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function getFilteredTasks() {
      if (currentFilter === "active") return tasks.filter((t) => !t.completed);
      if (currentFilter === "completed") return tasks.filter((t) => t.completed);
      return tasks;
    }

    // ---- Render ----
    function render() {
      const filtered = getFilteredTasks();
      taskList.innerHTML = "";

      if (filtered.length === 0) {
        taskList.innerHTML = `
          <li class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            <p>${currentFilter === "all" ? "No tasks yet. Add one above!" : currentFilter === "active" ? "No active tasks" : "No completed tasks"}</p>
          </li>
        `;
      } else {
        filtered.forEach((task) => {
          const li = document.createElement("li");
          li.className = "task-item" + (task.completed ? " completed" : "");
          li.dataset.id = task.id;

          li.innerHTML = `
            <div class="checkbox" role="checkbox" aria-checked="${task.completed}" tabindex="0">
              <svg viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <span class="task-text">${escapeHtml(task.text)}</span>
            <button class="delete-btn" aria-label="Delete task" title="Delete">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
              </svg>
            </button>
          `;

          // Toggle complete
          const checkbox = li.querySelector(".checkbox");
          checkbox.addEventListener("click", () => toggleTask(task.id));
          checkbox.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              toggleTask(task.id);
            }
          });

          // Delete
          li.querySelector(".delete-btn").addEventListener("click", () => deleteTask(task.id));

          taskList.appendChild(li);
        });
      }

      updateStats();
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function updateStats() {
      const remaining = tasks.filter((t) => !t.completed).length;
      const total = tasks.length;
      const completed = total - remaining;

      statsEl.textContent =
        remaining === 0 && total > 0
          ? "All done! 🎉"
          : `${remaining} task${remaining !== 1 ? "s" : ""} remaining`;

      countLabel.textContent = `${total} item${total !== 1 ? "s" : ""}`;
      clearCompletedBtn.disabled = completed === 0;
    }

    // ---- Actions ----
    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.unshift({
        id: generateId(),
        text,
        completed: false,
      });

      taskInput.value = "";
      save();
      render();
      taskInput.focus();
    }

    function toggleTask(id) {
      const task = tasks.find((t) => t.id === id);
      if (task) {
        task.completed = !task.completed;
        save();
        render();
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter((t) => t.id !== id);
      save();
      render();
    }

    function clearCompleted() {
      tasks = tasks.filter((t) => !t.completed);
      save();
      render();
    }

    // ---- Event listeners ----
    addBtn.addEventListener("click", addTask);

    taskInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTask();
    });

    clearCompletedBtn.addEventListener("click", clearCompleted);

    filterBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // ---- Init ----
    render();
    taskInput.focus();
  </script>
</body>
</html>
